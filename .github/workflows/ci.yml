name: CI — RAG Eval + Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  rag-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python tests/rag_eval.py --json

